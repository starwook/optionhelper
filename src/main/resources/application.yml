spring:
  application:
    name: optionhelper
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/optionhelper?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

optionhelper:
  market-data:
    # hyperliquid(공개 사이트, 키 없음) | fake(네트워크 없이 화면 확인). 옵션은 둘 다 모델 이론가.
    # TODO(로그인): 실제 시세(IBKR/Alpaca)는 재배포 불가라 소유자 로그인 기능과 함께 추가한다.
    source: hyperliquid
    hyperliquid:
      dex: xyz
  earnings:
    # fake | alphavantage
    source: fake
    # 관심 종목 실적 일정을 백그라운드로 주 1회 갱신
    background-refresh: true
  macro-actuals:
    # bls(키 없음) | fake. 경제지표 발표 결과(CPI·PPI·고용보고서)를 평소 6시간, 발표 후 2시간은 10분마다 받아 DB에 기록
    source: bls
    background-refresh: true
  macro-flash:
    # 발표 직후 공식 값보다 먼저 Claude(웹 검색)로 속보를 뽑는다. Claude 키가 없으면 자동으로 꺼짐
    enabled: true
  claude:
    # 앱 공용 Claude API 설정. 키는 application-local.yml의 optionhelper.antropic.api-key를 그대로 읽는다
    api-key: ${optionhelper.antropic.api-key:}
    model: claude-haiku-5-5
    # 앱 전체 월 호출 상한(Haiku + 검색 2회 ≈ 1회 0.02달러 → 한 달 최대 약 0.2달러)
    monthly-call-limit: 10
  pricing:
    risk-free-rate: 0.04
  recorder:
    enabled: true
    symbols: NVDA
    interval-ms: 60000
