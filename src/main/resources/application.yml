spring:
  application:
    name: optionhelper
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/optionhelper?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

optionhelper:
  market-data:
    # hyperliquid(공개 사이트, 키 없음) | fake(네트워크 없이 화면 확인). 옵션은 둘 다 모델 이론가.
    # TODO(로그인): 실제 시세(IBKR/Alpaca)는 재배포 불가라 소유자 로그인 기능과 함께 추가한다.
    source: hyperliquid
    hyperliquid:
      dex: xyz
  earnings:
    # fake | alphavantage
    source: fake
  pricing:
    risk-free-rate: 0.04
  recorder:
    enabled: true
    symbols: NVDA
    interval-ms: 60000
